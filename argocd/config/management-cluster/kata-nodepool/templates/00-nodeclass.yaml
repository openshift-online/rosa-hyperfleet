{{- $clusterName := required "global.cluster_name must be set via ApplicationSet valuesObject" .Values.global.cluster_name -}}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: kata
spec:
  # Custom RHEL-for-EKS AMI with rpm-ostree (bootc/OSTree-based).
  # Required because the OSC DaemonSet installs kata + QEMU via rpm-ostree.
  # Standard RHEL (dnf-based) will NOT work.
  # This AMI must be shared to the target account with both launch permission
  # AND KMS key access (if EBS snapshots are encrypted).
  amiSelectorTerms:
    - id: ami-098418f46830dcb37
  instanceProfile: {{ $clusterName }}-karpenter-node-role
  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/{{ $clusterName }}: owned
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: {{ $clusterName }}
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2
  cpuOptions:
    nestedVirtualization: "enabled"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.kataNodePool.rootVolumeSize | default "100Gi" }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  # Minimal userData — just kvm_intel module loading. The heavy lifting
  # (kata install, containerd config) is handled by the osc-kata-install
  # DaemonSet after the node joins the cluster.
  #
  # NOTE: With a custom AMI (amiSelectorTerms by ID), Karpenter does NOT
  # inject any managed bootstrap. The AMI itself must handle EKS node
  # bootstrap (joining the cluster, kubelet config, etc.) — either baked
  # into the image or via additional userData added here.
  userData: |
    #!/bin/bash
    set -euo pipefail

    # EC2 nested virtualization is enabled at the instance level via
    # cpuOptions.nestedVirtualization, but the kernel module isn't auto-loaded.
    # QEMU requires KVM for hardware-accelerated virtualization.
    modprobe kvm_intel 2>/dev/null || true
    echo "kvm_intel" > /etc/modules-load.d/kvm.conf
