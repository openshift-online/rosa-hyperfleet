# Default values for hypershift-install chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# All values are namespaced under 'hypershift' to maintain consistency
# with the rendering system and avoid conflicts with other charts
hypershift:
  # AWS region — used by the ASCP SecretProviderClass to fetch from Secrets Manager
  region: us-east-1

  # External DNS domain filter — set from config via render.py
  externalDns:
    domain: ""
    image: registry.redhat.io/edo/external-dns-rhel9:c8f7fbd233b9fbcc312672a6e5afd020655c791f

  # Hypershift configuration
  hypershift:
    # TEMP(OCPBUGS-42107 e2e): upstream-based build from the OCPBUGS-42107 branch to
    # test the AWS HC deletion cloud-resource cleanup fix end to end. This image does
    # NOT include the aws-iam-authenticator features or managed-ingress DNS (RFE-9235);
    # -api has ManagedDNS disabled to match. Restore the managed_ingress image before merge.
    # Branch: https://github.com/openshift/hypershift/tree/OCPBUGS-42107
    image: quay.io/cbusse_openshift/hypershift-operator:ocpbugs-42107-15d0bfec
