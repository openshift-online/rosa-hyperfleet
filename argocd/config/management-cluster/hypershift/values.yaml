# Default values for hypershift-install chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# All values are namespaced under 'hypershift' to maintain consistency
# with the rendering system and avoid conflicts with other charts
hypershift:
  # AWS region — used by the ASCP SecretProviderClass to fetch from Secrets Manager
  region: us-east-1

  # External DNS domain filter — set from config via render.py
  externalDns:
    domain: ""
    image: registry.redhat.io/edo/external-dns-rhel9:c8f7fbd233b9fbcc312672a6e5afd020655c791f

  # Hypershift configuration
  hypershift:
    # Self-built HyperShift operator for managed ingress DNS (RFE-9235).
    # Built from local openshift/hypershift managed_ingress (commit 014872538a).
    # Public image (the Konflux HO build is private and not cluster-pullable).
    # Requires --tech-preview-no-upgrade in 05-job.yaml for AWSManagedDNS feature gate.
    image: quay.io/cbusse_openshift/hypershift-operator:managed-ingress-dns-014872538a
