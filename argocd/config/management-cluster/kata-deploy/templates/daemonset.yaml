# Upstream kata-deploy DaemonSet for EKS.
#
# The kata-deploy image copies pre-built kata + QEMU binaries to /opt/kata/
# and creates a CRI-O drop-in config to register the kata-qemu runtime handler.
# On cleanup (pod termination), it removes the binaries and config.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kata-deploy
spec:
  selector:
    matchLabels:
      name: kata-deploy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        name: kata-deploy
    spec:
      serviceAccountName: osc-kata-install
      hostPID: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: kvm-init
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          securityContext:
            privileged: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              nsenter -t 1 -m -u -i -n -- modprobe kvm_intel 2>/dev/null || true
              nsenter -t 1 -m -u -i -n -- bash -c 'echo kvm_intel > /etc/modules-load.d/kvm.conf'
      containers:
        - name: kata-deploy
          image: {{ .Values.kataDeploy.image.repository }}:{{ .Values.kataDeploy.image.tag }}
          imagePullPolicy: {{ .Values.kataDeploy.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          command: ["bash", "-c", "/opt/kata-artifacts/scripts/kata-deploy.sh install"]
          lifecycle:
            preStop:
              exec:
                command: ["bash", "-c", "/opt/kata-artifacts/scripts/kata-deploy.sh cleanup"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEBUG
              value: "false"
            - name: INSTALLATION_PREFIX
              value: "/var"
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: kata-artifacts
              mountPath: /opt/kata/
            - name: dbus
              mountPath: /var/run/dbus
            - name: systemd
              mountPath: /run/systemd
          readinessProbe:
            exec:
              command:
                - stat
                - /opt/kata/bin/kata-runtime
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: kata-artifacts
          hostPath:
            path: /var/opt/kata/
            type: DirectoryOrCreate
        - name: dbus
          hostPath:
            path: /var/run/dbus
        - name: systemd
          hostPath:
            path: /run/systemd
