# Upstream kata-deploy DaemonSet for EKS.
#
# The kata-deploy image copies pre-built kata + QEMU binaries to /opt/kata/
# and configures the container runtime (containerd or CRI-O) with the
# kata-qemu runtime handler.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kata-deploy
spec:
  selector:
    matchLabels:
      name: kata-deploy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        name: kata-deploy
    spec:
      serviceAccountName: osc-kata-install
      hostPID: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kata-deploy
          image: {{ .Values.kataDeploy.image.repository }}:{{ .Values.kataDeploy.image.tag }}
          imagePullPolicy: {{ .Values.kataDeploy.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          command: ["bash", "-c", "/opt/kata-artifacts/scripts/kata-deploy.sh install"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEBUG
              value: "true"
            - name: SHIMS
              value: "qemu"
            - name: DEFAULT_SHIM
              value: "qemu"
            - name: CREATE_RUNTIMECLASSES
              value: "false"
            - name: CREATE_DEFAULT_RUNTIMECLASS
              value: "false"
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: kata-artifacts
              mountPath: /opt/kata/
            - name: dbus
              mountPath: /var/run/dbus
            - name: systemd
              mountPath: /run/systemd
          readinessProbe:
            exec:
              command:
                - stat
                - /opt/kata/bin/kata-runtime
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: kata-artifacts
          hostPath:
            path: /opt/kata/
            type: DirectoryOrCreate
        - name: dbus
          hostPath:
            path: /var/run/dbus
        - name: systemd
          hostPath:
            path: /run/systemd
