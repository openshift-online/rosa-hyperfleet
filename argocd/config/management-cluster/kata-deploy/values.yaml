# =============================================================================
# Upstream Kata Containers deployment for EKS (spike)
#
# Uses the upstream kata-deploy image which copies pre-built kata + QEMU
# binaries to /opt/kata/ and configures CRI-O with a drop-in config.
# This is NOT FIPS-compliant — for production we need Red Hat's builds.
# =============================================================================

kataDeploy:
  image:
    repository: quay.io/kata-containers/kata-deploy
    tag: "3.14.0"
    pullPolicy: IfNotPresent

nodeSelector:
  katacontainers.io/kata-runtime: "true"

tolerations:
  - key: hypershift.openshift.io/request-serving-component
    operator: Exists
    effect: NoSchedule

runtimeClass:
  # The RuntimeClass NAME is "kata-fc" because HyperShift hardcodes
  # runtimeClassName=kata-fc on request-serving pods. The HANDLER is
  # "kata-qemu" because that's what upstream kata-deploy registers.
  name: kata-fc
  handler: kata-qemu
  overhead:
    cpu: "250m"
    memory: "350Mi"
