# Karpenter subchart values
# These values are passed to the upstream Karpenter Helm chart dependency.
#
# Values from ApplicationSet valuesObject are merged with this file:
# - global.cluster_name → used in settings.clusterName
# - karpenter.controllerRoleArn → needs to be mapped to serviceAccount.annotations
#
# Since Helm values merging doesn't support cross-key references, we need
# the ApplicationSet to inject the role ARN at the correct path for the subchart.
# See config/templates/argocd-bootstrap/applicationset.yaml.j2 for injection logic.

karpenter:
  settings:
    # clusterName and interruptionQueue are injected by ApplicationSet valuesObject
    clusterName: ""
    interruptionQueue: ""

  serviceAccount:
    annotations:
      # This will be overridden by ApplicationSet valuesObject injection
      # ApplicationSet must inject at: karpenter.serviceAccount.annotations.eks\.amazonaws\.com/role-arn
      eks.amazonaws.com/role-arn: ""

  # Deliberate override: the karpenter chart's own default priorityClassName is
  # system-cluster-critical (2,000,000,000) — confirmed via `helm show values
  # oci://public.ecr.aws/karpenter/karpenter --version 1.14.0`. This downgrades
  # Karpenter to bootstrap-critical (100000) so it shares the same priority tier
  # as ArgoCD on the karpenter-bootstrap node group. Intentional — do not revert
  # to the chart default.
  priorityClassName: bootstrap-critical

  replicas: 2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: karpenter
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: karpenter

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  serviceMonitor:
    enabled: true
