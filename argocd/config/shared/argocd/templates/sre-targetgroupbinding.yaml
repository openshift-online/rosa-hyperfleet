{{- if index .Values "argo-cd" "sre" "targetGroup" "arn" }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: argocd-server-sre
  namespace: argocd
  annotations:
    # aws-load-balancer-controller CRD may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceRef:
    name: argocd-server
    port: 443
  targetGroupARN: {{ index .Values "argo-cd" "sre" "targetGroup" "arn" | quote }}
  targetType: ip
{{- end }}
