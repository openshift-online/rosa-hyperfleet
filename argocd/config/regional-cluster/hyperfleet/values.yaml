hyperfleet:
  applicationName: hyperfleet-operator

  namespace: argocd

  targetNamespace: hyperfleet

  project: default

  source:
    repoURL: https://github.com/typeid/rosa-hyperfleet-api.git
    targetRevision: managed_ingress
    path: hyperfleet-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: quay.io/cbusse_openshift/hyperfleet-operator
      tag: "managed-ingress-dns-25de57a"
      pullPolicy: Always

    # Operator-level control-plane-operator (CPO) override. The operator stamps
    # this image onto every HostedCluster it provisions via CONTROL_PLANE_OPERATOR_IMAGE.
    # Built from local openshift/hypershift managed_ingress (commit 014872538a).
    controlPlaneOperatorImage: quay.io/cbusse_openshift/control-plane-operator:managed-ingress-dns-014872538a

    replicaCount: 2

    serviceAccount:
      create: true
      name: hyperfleet-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

