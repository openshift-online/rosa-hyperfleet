{{- if .Values.grafana.sre.targetGroup.arn }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: grafana-sre
  namespace: {{ .Release.Namespace }}
  annotations:
    # aws-load-balancer-controller CRD may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceRef:
    name: grafana
    port: 80
  targetGroupARN: {{ .Values.grafana.sre.targetGroup.arn | quote }}
  targetType: ip
{{- end }}
