aws-load-balancer-controller:
  # clusterName and vpcId injected via ApplicationSet valuesObject
  vpcId: ""
  serviceAccount:
    create: true
    name: aws-load-balancer-controller

  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
