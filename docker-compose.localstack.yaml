# LocalStack development environment for ROSA HyperFleet.
#
# Emulates the multi-account AWS infrastructure locally so developers can test
# the deployment pipeline without real AWS accounts or clusters.
#
# Requires LocalStack Pro for full EKS emulation, Lambda container image
# support, and IAM policy enforcement. Set LOCALSTACK_AUTH_TOKEN in your
# environment before starting (see docs/localstack-testing.md).
#
# Podman users: activate the podman socket first:
#   systemctl --user enable --now podman.socket
#
# Usage:
#   export LOCALSTACK_AUTH_TOKEN=<your-token>
#   docker compose -f docker-compose.localstack.yaml up -d
#   # or via Makefile:
#   make localstack-up

services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: rosa-hyperfleet-localstack
    user: "0"
    privileged: true
    ports:
      - "4566:4566" # LocalStack Gateway
      - "4510-4559:4510-4559" # External service ports
    environment:
      # Enable all AWS services used by the ROSA HyperFleet platform.
      - SERVICES=s3,dynamodb,ssm,sts,iam,route53,cloudformation,codepipeline,codebuild,eks,rds,ecr,ec2,elbv2,apigateway,acm,secretsmanager,kms,cloudwatch,sns,sqs,cloudtrail,elasticache,lambda,ecs,cloudfront,logs
      - DEBUG=0
      - PERSISTENCE=1
      - DEFAULT_REGION=us-east-1
      # LocalStack Pro auth token (required — see docs/localstack-testing.md)
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN to your LocalStack Pro API key}
      # IAM policy enforcement — Pro feature, enabled so IAM policies are
      # actually tested against real permission checks.
      - ENFORCE_IAM=1
      # Use docker-reuse executor for Lambda — reuses containers across
      # invocations for faster cold starts (requires socket access).
      - LAMBDA_EXECUTOR=docker-reuse
      # Docker socket for ECS/EKS/Lambda container support.
      # Podman provides a compatible socket; see DOCKER_SOCK below.
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack:Z"
      - "${DOCKER_SOCK:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:Z"
      - "./scripts/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro,Z"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - localstack-net

networks:
  localstack-net:
    driver: bridge
