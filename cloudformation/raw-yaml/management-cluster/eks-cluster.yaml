AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Management Cluster EKS — cluster, addons, IAM, KMS.
  Equivalent to terraform/modules/eks-cluster.

Parameters:
  ClusterId:
    Type: String
    Description: Unique cluster identifier (e.g., mc01)

  ClusterVersion:
    Type: String
    Default: "1.34"

  VpcId:
    Type: AWS::EC2::VPC::Id

  VpcCidr:
    Type: String

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  # ===========================================================================
  # KMS — CloudWatch Logs encryption (FedRAMP AU-09)
  # ===========================================================================

  CloudWatchLogsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for EKS cluster CloudWatch log group encryption (FedRAMP AU-09)"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/eks/${ClusterId}/cluster"
      Tags:
        - Key: Name
          Value: !Sub "${ClusterId}-cloudwatch-logs"

  CloudWatchLogsKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ClusterId}-cloudwatch-logs"
      TargetKeyId: !Ref CloudWatchLogsKmsKey

  # ===========================================================================
  # CloudWatch Log Group
  # ===========================================================================

  EksClusterLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: CloudWatchLogsKmsKey
    Properties:
      LogGroupName: !Sub "/aws/eks/${ClusterId}/cluster"
      RetentionInDays: 365
      KmsKeyId: !GetAtt CloudWatchLogsKmsKey.Arn

  # ===========================================================================
  # KMS — EKS Secrets encryption
  # ===========================================================================

  EksSecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for EKS cluster secrets encryption
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: EnableEKSAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt EksClusterRole.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ClusterId}-eks-secrets"

  EksSecretsKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ClusterId}-eks-secrets"
      TargetKeyId: !Ref EksSecretsKmsKey

  # ===========================================================================
  # IAM — EKS Cluster Service Role
  # ===========================================================================

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterId}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSComputePolicy
        - arn:aws:iam::aws:policy/AmazonEKSBlockStoragePolicy
        - arn:aws:iam::aws:policy/AmazonEKSLoadBalancingPolicy
        - arn:aws:iam::aws:policy/AmazonEKSNetworkingPolicy

  # ===========================================================================
  # IAM — EKS Auto Mode Node Role
  # ===========================================================================

  EksAutoModeNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterId}-auto-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodeMinimalPolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly

  # ===========================================================================
  # EKS Cluster
  # ===========================================================================

  EksCluster:
    Type: AWS::EKS::Cluster
    DependsOn:
      - EksClusterRole
      - EksClusterLogGroup
      - EksSecretsKmsKey
    Properties:
      Name: !Ref ClusterId
      Version: !Ref ClusterVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      BootstrapSelfManagedAddons: false
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      EncryptionConfig:
        - Resources:
            - secrets
          Provider:
            KeyArn: !GetAtt EksSecretsKmsKey.Arn
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
        SecurityGroupIds:
          - !Ref ClusterSecurityGroupId
      ComputeConfig:
        Enabled: true
        NodePools:
          - system
        NodeRoleArn: !GetAtt EksAutoModeNodeRole.Arn
      KubernetesNetworkConfig:
        ElasticLoadBalancing:
          Enabled: true
      StorageConfig:
        BlockStorage:
          Enabled: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler

  # ===========================================================================
  # EKS Addons
  # ===========================================================================

  AddonCoreDns:
    Type: AWS::EKS::Addon
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref ClusterId
      AddonName: coredns

  AddonMetricsServer:
    Type: AWS::EKS::Addon
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref ClusterId
      AddonName: metrics-server

  AddonPodIdentityAgent:
    Type: AWS::EKS::Addon
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref ClusterId
      AddonName: eks-pod-identity-agent

  AddonSecretsStoreCsiDriver:
    Type: AWS::EKS::Addon
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref ClusterId
      AddonName: aws-secrets-store-csi-driver-provider
      ConfigurationValues: '{"secrets-store-csi-driver":{"syncSecret":{"enabled":true}}}'

Outputs:
  ClusterName:
    Value: !Ref EksCluster

  ClusterArn:
    Value: !GetAtt EksCluster.Arn

  ClusterEndpoint:
    Value: !GetAtt EksCluster.Endpoint

  ClusterCertificateAuthorityData:
    Value: !GetAtt EksCluster.CertificateAuthorityData

  EksClusterRoleArn:
    Value: !GetAtt EksClusterRole.Arn

  NodeRoleArn:
    Value: !GetAtt EksAutoModeNodeRole.Arn

  KmsKeyArn:
    Value: !GetAtt EksSecretsKmsKey.Arn
