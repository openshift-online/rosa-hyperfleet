AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Prometheus Remote Write — MC → RC metrics forwarding via API Gateway.
  Equivalent to terraform/modules/prometheus-remote-write.

Parameters:
  ManagementId:
    Type: String

  EksClusterName:
    Type: String

  RegionalAwsAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"

Resources:
  PrometheusRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ManagementId}-prometheus"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: api-gateway-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: execute-api:Invoke
                Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${RegionalAwsAccountId}:*/*/POST/api/v1/receive"

  Sigv4ProxyAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Ref EksClusterName
      Namespace: monitoring
      ServiceAccount: sigv4-proxy
      RoleArn: !GetAtt PrometheusRole.Arn

Outputs:
  PrometheusRoleArn:
    Value: !GetAtt PrometheusRole.Arn
