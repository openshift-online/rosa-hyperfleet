applications:
  regional-cluster:
    platformApi:
      authz:
        config: |
          formatVersion: 1
          registeredAccounts: ["599476212575", "114594328247"]
          policies:
            - id: read-clusters-599476212575
              ownerAccountID: "599476212575"
              content: |
                permit(principal, action in HyperFleet::Action::"AllActions", resource)
                when { context.accountId == "599476212575" && context.region == "us-east-1" };
            - id: read-clusters-114594328247
              ownerAccountID: "114594328247"
              content: |
                permit(principal, action in HyperFleet::Action::"AllActions", resource)
                when { context.accountId == "114594328247" && context.region == "us-east-1" };
          attachments:
            - id: dev-readers-599476212575
              policyID: read-clusters-599476212575
              principalARN: arn:aws:iam::599476212575:role/{{ aws.child_admin_role_name }}
              scope: regional
              region: us-east-1
            - id: dev-readers-114594328247
              policyID: read-clusters-114594328247
              principalARN: arn:aws:iam::114594328247:role/{{ aws.child_admin_role_name }}
              scope: regional
              region: us-east-1
          serviceOperatorPolicies:
            - id: provision-management-clusters
              ownerAccountID: "599476212575"
              content: |
                permit(principal, action in [HyperFleet::Action::"CreateManagementCluster", HyperFleet::Action::"ListManagementClusters", HyperFleet::Action::"DescribeManagementCluster"], resource);
          serviceOperatorAttachments:
            - id: regional-provisioner
              policyID: provision-management-clusters
              principalARN: arn:aws:iam::599476212575:role/{{ child_admin_role_name }}
              scope: regional
              region: us-east-1
